<!DOCTYPE html>
<html lang="cs">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Akademie Taekwon-do SKUP Olomouc</title>

		<!-- Primary metadata -->
		<link rel="canonical" href="https://taekol.com">
		<meta
			name="description"
			content="Tréninky, semináře a soutěže v Taekwon-do pro děti i dospělé. Přidejte se k nám a zlepšete své dovednosti v bojovém umění."
		>
		<meta
			name="keywords"
			content="Taekwon-do, Olomouc, tréninky, semináře, soutěže, bojové umění, děti, dospělí, sport, fitness, zdraví, sebeobrana, techniky, cvičení, klub, akademie, SKUP"
		>
		<meta name="author" content="Albert Petrovskyi">
		<meta name="robots" content="index, follow">
		<meta name="theme-color" content="#f9f9f9">

		<!-- Icons and manifest -->
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/icons/apple-touch-icon.png"
		>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/icons/favicon-32x32.png"
		>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/icons/favicon-16x16.png"
		>
		<link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
		<link rel="manifest" href="/site.webmanifest">

		<!-- Styles and preloads -->
		<link rel="stylesheet" href="../src/css/form.css">
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="../src/assets/fonts/CalSans.woff2"
			crossorigin
		>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="../src/assets/fonts/FunnelDisplay.woff2"
			crossorigin
		>

		<!-- Open Graph / Twitter -->
		<meta property="og:title" content="Akademie Taekwon-do SKUP Olomouc">
		<meta
			property="og:description"
			content="Tréninky, semináře a soutěže v Taekwon-do pro děti i dospělé. Přidejte se k nám a zlepšete své dovednosti v bojovém umění."
		>
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://taekol.com">
		<meta property="og:image" content="https://taekol.com/banner.jpg">
		<meta property="og:locale" content="cs_CZ">

		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="Akademie Taekwon-do SKUP Olomouc">
		<meta
			name="twitter:description"
			content="Tréninky, semináře a soutěže v Taekwon-do pro děti i dospělé. Přidejte se k nám a zlepšete své dovednosti v bojovém umění."
		>
		<meta name="twitter:image" content="https://taekol.com/banner.jpg">

		<!-- Scripts -->
		<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
		<script src="../src/js/form.js"></script>
		<script>
		fetch("/schemas/schema-combined.json")
			.then((res) => res.text())
			.then((json) => {
				const s = document.createElement("script");
				s.type = "application/ld+json";
				s.textContent = json;
				document.head.appendChild(s);
			});
		</script>
	</head>
	<body>
		<div id="wrapper">
			<img src="../src/assets/images/red-bg.jpg" alt="background_image">

			<main>
				<form id="reg" onsubmit="event.preventDefault();" action="" method="">
					<h1>Registrace</h1>

					<!-- KROK 1: ÚDAJE -->
					<div id="step-1" class="reg__step active">
						<div class="stepper">
							<div class="stepper__item active">
								<div class="stepper__circle">1</div>
								<span class="stepper__label">Údaje</span>
							</div>

							<div class="stepper__line"></div>

							<div class="stepper__item">
								<div class="stepper__circle">2</div>
								<span class="stepper__label">Platba</span>
							</div>

							<div class="stepper__line"></div>

							<div class="stepper__item">
								<div class="stepper__circle">3</div>
								<span class="stepper__label">Potvrzení</span>
							</div>
						</div>



						<!-- Turnstile Widget -->
						<div class="cf-turnstile" data-sitekey="%VITE_TURNSTILE_SITE_KEY%" data-theme="light" data-appearance="interaction-only" data-size="flexible" data-language="cs" data-error-callback="onTurnstileError" data-expired-callback="onTurnstileExpired"></div>

						<!-- Honeypot -->
						<input type="text" name="website" style="display:none !important;" tabindex="-1" autocomplete="off">

						<div class="action-btns">
							<a href="/">Domů</a>
							<button type="button" onclick="goToStep(2)">Next</button>
						</div>
					</div>

					<!-- KROK 2: PLATBA -->
					<div id="step-2" class="reg__step" style="display: none;">
						<div class="stepper">
							<div class="stepper__item completed">
								<div class="stepper__circle">1</div>
								<span class="stepper__label">Údaje</span>
							</div>

							<div class="stepper__line-dark"></div>

							<div class="stepper__item active">
								<div class="stepper__circle">2</div>
								<span class="stepper__label">Platba</span>
							</div>

							<div class="stepper__line"></div>

							<div class="stepper__item">
								<div class="stepper__circle">3</div>
								<span class="stepper__label">Potvrzení</span>
							</div>
						</div>

						<div class="action-btns">
							<button type="button" onclick="goToStep(1)">Zpátky</button>
							<button type="button" onclick="submitForm()">Zaplaceno</button>
						</div>
					</div>

					<!-- KROK 3: POTVRZENÍ -->
					<div id="step-3" class="reg__step" style="display: none;">
						<div class="stepper">
							<div class="stepper__item completed">
								<div class="stepper__circle">1</div>
								<span class="stepper__label">Údaje</span>
							</div>

							<div class="stepper__line-dark"></div>

							<div class="stepper__item completed">
								<div class="stepper__circle">2</div>
								<span class="stepper__label">Platba</span>
							</div>

							<div class="stepper__line-dark"></div>

							<div class="stepper__item active">
								<div class="stepper__circle">3</div>
								<span class="stepper__label">Potvrzení</span>
							</div>
						</div>

						<div class="action-btns">
							<button type="button" onclick="goToStep(2)">Zpátky</button>
							<a href="/classes">Domů</a>
						</div>
					</div>
				</form>
			</main>
		</div>
	</body>
</html>
